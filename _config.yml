intro: |
  Software engineer working in the industry since 2017, primarily in Java, and across a broad range of technologies since: Python, Go, TypeScript, Kotlin, C#/.NET, Oracle PL/SQL, AWS, Git and Maven. <br/><br/>
  Much of my recent work goes into agentic AI tooling — Claude Code plugins, MCP servers, and local proxies that record what an LLM request sent, what came back, what it cost and which parameters were silently dropped — alongside Kotlin/Jetpack Compose Android apps and cross-platform desktop tools.<br/><br/>
  I have been contributing to open source for years, and am passionate about sharing and gaining knowledge on technology.

#An additional info freetext section is optional at the bottom of the page - can be text or HTML
additionalinfo: |
   <strong>Java</strong>: experienced across a variety of Java APIs and frameworks, Spring in particular. <br/><br/>
   <strong>Go</strong>: my language of choice for local tooling — the Claude Lens and deepseek-lens proxies are each a single Go binary. <br/><br/>
   <strong>AI and agentic tooling</strong>: I build Claude Code plugins, skills and hooks, MCP servers for databases, and local proxies that record what a request sent, what came back, what it cost and which parameters were dropped. <br/><br/>
   <strong>Android</strong>: Kotlin with Jetpack Compose, used to build a file locker, call blocker, parental-control and expense-splitter app. <br/><br/>
   <strong>Python</strong>: utility applications and scripting, including gite (a git extra command set) and AWS Lambda workloads. <br/><br/>
   <strong>Cloud platforms</strong>: AWS — EC2, S3, Beanstalk, Lambda, CloudFront and IAM — for both learning and production use.<br/><br/>
   <strong>Embedded</strong>: from college days and a lasting interest in IoT, microcontrollers (Arduino/AVR) and single-board computers such as Raspberry Pi.<br/><br/>
   <strong>Development Control</strong>: application life-cycle management with CVS, Git and Maven, plus Selenium and GitHub Actions CI.<br/><br/>
   As an open-source contributor I have created, and remain the primary contributor to, a number of GitHub and GitLab projects, public and private — I am passionate about sharing and gaining knowledge.
